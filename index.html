<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Okbi - Portfolyo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080504;
            color: #d7ccc8;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background: linear-gradient(145deg, #160c08, #0a0403);
            border: 1px solid #ff572255;
            border-radius: 24px;
            padding: 45px;
            width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 30px rgba(255,87,34,0.1);
            text-align: center;
        }
        h1 {
            color: #ff5722;
            font-size: 36px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255,87,34,0.4);
        }
        .subtitle {
            color: #8d6e63;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        .section-title {
            color: #ff8a65;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: left;
            margin-bottom: 12px;
            border-left: 3px solid #ff5722;
            padding-left: 8px;
        }
        .social-box {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .social-btn {
            flex: 1;
            padding: 12px;
            background: #1f100a;
            color: #ff8a65;
            border: 1px solid #ff572244;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            background: #ff5722;
            color: #080504;
            box-shadow: 0 0 20px rgba(255,87,34,0.6);
            transform: translateY(-2px);
        }
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .game-btn {
            background: #1a0c07;
            color: #ffccbc;
            border: 1px solid #ff572266;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .game-btn span { font-size: 12px; color: #ff5722; }
        .game-btn:hover {
            background: #2b120a;
            border-color: #ff5722;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(255,87,34,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OKBI</h1>
        <div class="subtitle">Digital Creator & Developer</div>
        
        <div class="section-title">Projelerime Bakın</div>
        <div class="social-box">
            <a href="https://github.com/Muhammedokbi" class="social-btn" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/muhammedokbi/" class="social-btn" target="_blank">LinkedIn</a>
        </div>

        <div class="section-title">Arcade Oyun Merkezi</div>
        <div class="game-list">
            <a href="oyun1.html" class="game-btn">🕹️ 1. Taş - Kağıt - Makas <span>OYNA →</span></a>
            <a href="oyun2.html" class="game-btn">🎯 2. Sayı Tahmin Simülasyonu <span>OYNA →</span></a>
            <a href="oyun3.html" class="game-btn" style="border-color: #4caf50; color: #a5d6a7;">🧟 3. The Last Stand (TLOU Tarzı) <span>HAYATTA KAL →</span></a>
        </div>
    </div>
</body>
</html>
