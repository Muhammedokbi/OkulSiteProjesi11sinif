<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Masada Düello - Taş Kağıt Makas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1200px;
        }
        .masa-sahnesi {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            border-radius: 24px;
            padding: 40px;
            width: 500px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(56,189,248,0.2);
            transform: rotateX(5deg);
        }
        h2 { color: #38bdf8; margin-bottom: 5px; font-size: 22px; letter-spacing: 1px; }
        .masa-ustu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #090d16;
            padding: 20px;
            border-radius: 16px;
            margin: 25px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .oyuncu-koltuk {
            text-align: center;
            width: 45%;
        }
        .oyuncu-koltuk h4 { color: #94a3b8; font-size: 13px; margin-bottom: 8px; }
        .avatar-kutu {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 15px;
            font-size: 28px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.5);
        }
        .vs-text { font-weight: bold; color: #f43f5e; font-size: 18px; }
        .kontrol-paneli { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .hamle-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .hamle-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(56,189,248,0.4);
        }
        #durumMesaji {
            background: #090d16;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #38bdf8;
            font-size: 14px;
            min-height: 50px;
        }
        .geri-don { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 13px; }
        .geri-don:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="masa-sahnesi">
        <h2>MASADA DÜELLO</h2>
        <p style="color:#64748b; font-size:12px;">Karşılıklı Oturan Oyuncu vs Yapay Zeka</p>

        <div class="masa-ustu">
            <div class="oyuncu-koltuk">
                <h4>SEN (Oyuncu)</h4>
                <div class="avatar-kutu" id="userAvatar">❔</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="oyuncu-koltuk">
                <h4>RAKİP (AI)</h4>
                <div class="avatar-kutu" id="pcAvatar">❔</div>
            </div>
        </div>

        <div class="kontrol-paneli">
            <button class="hamle-btn" onclick="hamleYap('Taş')">✊ Taş</button>
            <button class="hamle-btn" onclick="hamleYap('Kağıt')">✋ Kağıt</button>
            <button class="hamle-btn" onclick="hamleYap('Makas')">✌️ Makas</button>
        </div>

        <div id="durumMesaji">Masa kuruldu. Hamleni seç ve masaya vur!</div>
        <a href="index.html" class="geri-don">← Ana Menüye Dön</a>
    </div>

    <script>
        const semboller = { "Taş": "✊ Taş", "Kağıt": "✋ Kağıt", "Makas": "✌️ Makas" };

        function hamleYap(userSecim) {
            let secenekler = ["Taş", "Kağıt", "Makas"];
            let pcSecim = secenekler[Math.floor(Math.random() * 3)];

            document.getElementById("userAvatar").innerHTML = semboller[userSecim];
            document.getElementById("pcAvatar").innerHTML = semboller[pcSecim];

            let mesaj = "";
            if (userSecim === pcSecim) {
                mesaj = `🤝 <b>Masa Tokalaştı!</b> İkiniz de ${userSecim} seçtiniz, berabere.`;
            } else if (
                (userSecim === "Taş" && pcSecim === "Makas") ||
                (userSecim === "Kağıt" && pcSecim === "Taş") ||
                (userSecim === "Makas" && pcSecim === "Kağıt")
            ) {
                mesaj = `🎉 <span style="color:#34d399">Masayı Yendin!</span> ${userSecim}, rakibin ${pcSecim} hamlesini ezdi.`;
            } else {
                mesaj = `💥 <span style="color:#f43f5e">Masada Kaybettin!</span> Rakibin ${pcSecim} hamlesi seni alt etti.`;
            }

            document.getElementById("durumMesaji").innerHTML = mesaj;
        }
    </script>
</body>
</html>
