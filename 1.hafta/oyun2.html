<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault Breaker | Kasa Oyunu</title>
    <style>
        :root {
            --bg: #070d14;
            --bg-2: #101b29;
            --panel: rgba(18, 24, 33, 0.92);
            --panel-strong: rgba(10, 14, 20, 0.96);
            --gold: #f8b84f;
            --gold-2: #ffdd7d;
            --amber: #ff9d2f;
            --red: #ff5c58;
            --green: #4ade80;
            --cyan: #87d9ff;
            --text: #f4efe7;
            --muted: #c6c1b6;
            --line: rgba(255, 180, 83, 0.34);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(248, 184, 79, 0.12), transparent 26%),
                radial-gradient(circle at bottom, rgba(135, 217, 255, 0.09), transparent 25%),
                linear-gradient(135deg, var(--bg), var(--bg-2) 55%, #0b0d12);
            padding: 24px 16px;
        }

        .vault-stage {
            width: min(820px, 100%);
            border-radius: 28px;
            background: rgba(8, 12, 17, 0.92);
            border: 1px solid var(--line);
            box-shadow: 0 28px 80px rgba(0,0,0,0.72), 0 0 22px rgba(245, 184, 79, 0.12);
            padding: 22px 20px 18px;
            transform: perspective(1200px) rotateX(4deg);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold-2);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--amber);
            text-shadow: 0 0 12px rgba(255, 157, 47, 0.2);
        }

        .status-pill {
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255, 190, 92, 0.26);
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .vault-box {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr;
            gap: 20px;
            background: linear-gradient(180deg, rgba(18, 25, 35, 0.96), rgba(7, 10, 15, 0.96));
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px;
            padding: 20px;
        }

        .safe-panel {
            position: relative;
            padding: 22px 18px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(11, 16, 22, 0.9), rgba(9, 10, 15, 0.96));
            border: 1px solid rgba(255, 186, 94, 0.25);
            box-shadow: inset 0 10px 24px rgba(255,255,255,0.02), inset 0 -10px 20px rgba(0,0,0,0.3);
        }

        .safe-panel::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.04);
            pointer-events: none;
        }

        .display {
            position: relative;
            margin-top: 18px;
            background: linear-gradient(180deg, #04080d, #060e12);
            border: 2px inset rgba(255, 180, 83, 0.58);
            border-radius: 16px;
            padding: 24px 18px;
            font-size: clamp(2rem, 5vw, 3rem);
            text-align: center;
            letter-spacing: 0.25em;
            color: var(--gold-2);
            text-shadow: 0 0 18px rgba(248, 184, 79, 0.45);
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.7);
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-board {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .mini-box {
            flex: 1;
            text-align: center;
            border-radius: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 14px 10px;
        }

        .mini-box span {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .mini-box strong {
            font-size: 1.4rem;
            color: var(--gold-2);
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .key {
            border: 1px solid rgba(255, 180, 83, 0.4);
            background: linear-gradient(180deg, rgba(38, 48, 60, 0.92), rgba(17, 23, 31, 0.92));
            color: var(--text);
            border-radius: 14px;
            min-height: 64px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 18px rgba(0,0,0,0.2);
        }

        .key:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 214, 120, 0.8);
            box-shadow: 0 16px 26px rgba(248,184,79,0.18);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 14px 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.18s ease, filter 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }

        .clear-btn {
            background: linear-gradient(180deg, #a42c2c, #6c1515);
            color: white;
        }

        .enter-btn {
            background: linear-gradient(180deg, #1f9c58, #0c6a39);
            color: white;
        }

        .log-box {
            min-height: 88px;
            background: rgba(3, 7, 12, 0.9);
            border: 1px solid rgba(255,255,255,0.06);
            border-left: 4px solid var(--gold);
            border-radius: 14px;
            padding: 14px 14px;
            color: var(--muted);
            line-height: 1.55;
            font-size: 0.96rem;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-top: 18px;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            color: var(--gold);
        }

        @media (max-width: 720px) {
            .vault-box {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .status-board {
                flex-wrap: wrap;
            }

            .footer-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="vault-stage">
        <div class="topbar">
            <div class="meta">
                <span class="eyebrow">Secure Lock</span>
                <h1>Vault</h1>
            </div>
            <div class="status-pill">Mission Active</div>
        </div>

        <div class="vault-box">
            <div class="safe-panel">
                <div class="display" id="displayBox">_ _</div>

                <div class="status-board">
                    <div class="mini-box">
                        <span>Deneme</span>
                        <strong id="attemptCount">0</strong>
                    </div>
                    <div class="mini-box">
                        <span>Seviye</span>
                        <strong id="levelCount">01</strong>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="pad">
                    <button class="key" onclick="pressKey(1)">1</button>
                    <button class="key" onclick="pressKey(2)">2</button>
                    <button class="key" onclick="pressKey(3)">3</button>
                    <button class="key" onclick="pressKey(4)">4</button>
                    <button class="key" onclick="pressKey(5)">5</button>
                    <button class="key" onclick="pressKey(6)">6</button>
                    <button class="key" onclick="pressKey(7)">7</button>
                    <button class="key" onclick="pressKey(8)">8</button>
                    <button class="key" onclick="pressKey(9)">9</button>
                    <div></div>
                    <button class="key" onclick="pressKey(0)">0</button>
                    <div></div>
                </div>

                <div class="actions">
                    <button class="action-btn clear-btn" onclick="clearInput()">Sil</button>
                    <button class="action-btn enter-btn" onclick="tryCode()">Aç</button>
                </div>

                <div class="log-box" id="logBox">> Kasa kilitli. 1 ile 50 arasında gizli kombinasyonu bul.</div>
            </div>
        </div>

        <div class="footer-row">
            <div></div>
            <a class="back-link" href="index.html">← Ana Menüye Dön</a>
        </div>
    </div>

    <script>
        let secretCode = Math.floor(Math.random() * 50) + 1;
        let inputValue = "";
        let attempts = 0;
        let level = 1;

        const displayBox = document.getElementById('displayBox');
        const logBox = document.getElementById('logBox');

        function updateDisplay() {
            displayBox.textContent = inputValue ? inputValue : '_ _';
        }

        function updateStats() {
            document.getElementById('attemptCount').textContent = attempts;
            document.getElementById('levelCount').textContent = String(level).padStart(2, '0');
        }

        function pressKey(value) {
            if (inputValue.length < 2) {
                inputValue += value;
                updateDisplay();
            }
        }

        function clearInput() {
            inputValue = "";
            updateDisplay();
        }

        function tryCode() {
            if (!inputValue) {
                logBox.innerHTML = '> Boş giriş. Kodunu yaz ve dene.';
                return;
            }

            const guess = Number(inputValue);
            attempts += 1;
            updateStats();

            if (guess === secretCode) {
                logBox.innerHTML = `> <span style="color:#4ade80; font-weight:700;">KASA AÇILDI.</span> Doğru kod: <strong>${secretCode}</strong> (${attempts}. deneme)`;
                secretCode = Math.floor(Math.random() * 50) + 1;
                level += 1;
                attempts = 0;
                inputValue = "";
                updateDisplay();
                updateStats();
                return;
            }

            if (guess < secretCode) {
                logBox.innerHTML = `> <span style="color:#ffbe5c; font-weight:700;">Yüksek.</span> Kod daha büyük olmalı.`;
            } else {
                logBox.innerHTML = `> <span style="color:#ff7a7a; font-weight:700;">Düşük.</span> Kod daha küçük olmalı.`;
            }

            inputValue = "";
            updateDisplay();
        }

        updateDisplay();
        updateStats();
    </script>
<style>.project-home-return:hover{transform:translateY(-3px);background:#2a2730!important;border-color:#e5d19f!important;color:#f6e8bc!important;box-shadow:0 12px 28px #0008,0 0 18px #d5b87722}.project-home-return:focus-visible{outline:2px solid #e5d19f;outline-offset:4px}</style>

</body>
</html>
